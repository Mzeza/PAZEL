<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d42d9">

<title>PAZEL</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="png.png">

</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <small id="todayLabel"></small>
      <h1 id="pageTitle">پلنر ساعتی</h1>
    </div>
    <button class="icon-btn" id="menuBtn">☰</button>
  </header>

  <main id="content"></main>

  <small id="todayLabel" style="display: flex; flex-direction: row; justify-content: center; text-align: center; font-size: 11px;">زیر مجموعه کانون فرهنگی تربیتی برهان<br>آیدی پشتیبان M_zeza@</small>

  <nav class="bottom-nav">
    <button data-tab="notes" class="nav-item"><span>✎</span><b>یادداشت‌ها</b></button>
    <button data-tab="planner" class="nav-item active"><span>❍</span><b>پلنر ساعتی</b></button>
    <button data-tab="habits" class="nav-item"><span>☷</span><b>عادت‌های ماه</b></button>
  </nav>
</div>
<div id="toast"></div>
<script src="app.js"></script>

<div id="settingsMenu" class="settings-menu">
  <div class="settings-box">
    <div class="settings-header">
      <b>تنظیمات</b>
      <button class="close-settings" onclick="closeSettings()">×</button>
    </div>
    <div class="settings-item">
      <div>
        <strong>ذخیره خودکار</strong>
        <small>اطلاعات شما به صورت خودکار ذخیره می‌شود.</small>
      </div>
      <span>✓</span>
    </div>
    <button class="reset-button" onclick="resetPlanner()">شروع دوباره پلنر</button>
    <p class="warning-text">با شروع دوباره، تمام یادداشت‌ها، اهداف، عادت‌ها و برنامه‌های ساعتی حذف می‌شوند.</p>
  </div>
</div>
</body>
</html>
